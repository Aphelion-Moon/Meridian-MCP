[package]
name = "meridian-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "MCP server for DreamMaker language support"
license = "MIT"

[dependencies]
# SpacemanDMM crates from GitHub
dreammaker = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
dreamchecker = { version = "=1.11.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
dmi = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605" }
dmm-tools = { version = "=0.1.0", git = "https://github.com/SpaceManiac/SpacemanDMM", rev = "351ddc0ffb2439876d4565ce5130bb6b027ee605", features = ["png", "gif"] }

# MCP/JSON-RPC handling
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# Bounded request diagnostics retain the nested field path without echoing values.
serde_path_to_error = "=0.1.20"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
foldhash = "0.2"
rmcp = { version = "=3.1.3", features = ["server", "transport-io", "schemars"] }
schemars = "1"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Image handling for map screenshots
image = "0.24"
png = "0.17"
fdeflate = "0.3.7"

# Process handling for compiler
which = "6.0"
regex = "1.0"
sha2 = "0.10"
getrandom = "0.4"
bincode = "1.3.3"
toml = "0.5.11"
csv = "1.3"
time = { version = "0.3", features = ["parsing", "formatting"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true

[patch."https://github.com/SpaceManiac/SpacemanDMM"]
dreammaker = { path = "vendor/spacemandmm/dreammaker" }
dmm-tools = { path = "vendor/spacemandmm/dmm-tools" }
