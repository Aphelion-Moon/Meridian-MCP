name: Rust and MCP checks

env:
  MERIDIAN_BUILD_REVISION: ${{ github.sha }}
  MERIDIAN_BUILD_DIRTY: "false"

on:
  push:
  pull_request:

jobs:
  native-memory-build:
    name: Optional native memory helper build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: willox/auxtools
          ref: 889006e334570a426f35c0a2f579c08d3d7b2186
          path: integration/auxtools
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: i686-pc-windows-msvc
      - name: Build pinned helper with maintained overlays
        shell: pwsh
        run: ./scripts/build-auxtools-memory.ps1 -SourceRoot ./integration/auxtools -BuildRoot ./target/aux-memory-build -OutputDirectory ./target/aux-memory-package
  rust:
    name: Rust and MCP (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            binary: .\target\release\meridian-mcp.exe
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            binary: ./target/release/meridian-mcp
    runs-on: ${{ matrix.os }}
    env:
      MERIDIAN_MCP_HELPER_MANIFEST: ${{ github.workspace }}/integration/helpers-manifest.json
    steps:
      - uses: actions/checkout@v7
      - name: Check out exact SpacemanDMM helper source
        uses: actions/checkout@v7
        with:
          repository: SpaceManiac/SpacemanDMM
          ref: 351ddc0ffb2439876d4565ce5130bb6b027ee605
          path: integration/SpacemanDMM
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build exact dmdoc helper
        shell: pwsh
        run: ./scripts/build-spacemandmm-helpers.ps1 -UpstreamPath ./integration/SpacemanDMM -OutputDirectory ./integration -ManifestPath ./integration/helpers-manifest.json
      - name: Audit SpacemanDMM capability registry
        shell: pwsh
        run: ./scripts/audit-spacemandmm-capabilities.ps1 -Check
      - name: Test Meridian compatibility evidence validation
        shell: pwsh
        run: ./scripts/test-meridian-evidence-validation.ps1
      - name: Test Codex configuration preservation
        shell: pwsh
        run: ./scripts/test-configure-codex-meridian-mcp.ps1
      - name: Print exact Rust toolchain
        run: rustc --version --verbose
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Portable provenance and evidence gates
        run: cargo test --locked --test repository_roots --test proc_resolution --test build_provenance --test runtime_integrity --test native_evidence_readers --test native_evidence_timeline --test native_evidence_summary --test native_evidence_comparison
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - name: Installed stdio MCP protocol smoke
        shell: pwsh
        run: ./test_mcp.ps1 -SkipBuild -BinaryPath '${{ matrix.binary }}' -Mode development
      - name: Installed stdio MCP fixture smoke
        shell: pwsh
        run: |
          ./test_mcp.ps1 -SkipBuild -BinaryPath '${{ matrix.binary }}' -Mode analysis `
            -DmePath ./tests/fixtures/language/fixture.dme `
            -SearchQuery 'return supplied value'
      - name: Non-Windows rift_compile boundary
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          MERIDIAN_MCP_RIFT_BUILD: network
        run: ./scripts/test_unsupported_rift_compile.ps1 -BinaryPath '${{ matrix.binary }}'

  dependency-policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  tracy-native:
    name: Tracy native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Ubuntu 24.04
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: wolfpld/tracy
          ref: 099df3de3dc37eca4712c06b8320fb9c53596edd
          path: integration/tracy
      - uses: actions/checkout@v7
        with:
          repository: spacestation13/byond-tracy
          ref: d1ec404737b04b1ea73d6df4a1b477deacdb1900
          path: integration/byond-tracy
      - name: Install Ubuntu x86 build support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib g++-multilib patch
      - name: Expose Git patch on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'
      - name: Build, test, and package pinned Tracy artifacts
        shell: pwsh
        run: ./scripts/run-tracy-native-tests.ps1 -TracyPath ./integration/tracy -ByondTracyPath ./integration/byond-tracy -BuildRoot '${{ runner.temp }}/meridian-tracy-native' -CpmSourceCache '${{ runner.temp }}/meridian-tracy-cpm' -OutputDirectory ./integration/tracy-package -ManifestPath ./integration/tracy-package/helpers/manifest.json
      - name: Upload Tracy package evidence
        uses: actions/upload-artifact@v6
        with:
          name: tracy-native-${{ runner.os }}
          path: |
            integration/tracy-package/helpers/manifest.json
            integration/tracy-package/helpers/licenses/*
            !**/*.tracy
          if-no-files-found: error

  ubuntu-meridian-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SpaceManiac/SpacemanDMM
          ref: 351ddc0ffb2439876d4565ce5130bb6b027ee605
          path: integration/SpacemanDMM
      - uses: actions/checkout@v7
        with:
          repository: AphelionDevelopment/Meridian-Rift
          path: integration/Meridian-Rift
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build exact dmdoc helper and release MCP
        shell: pwsh
        run: |
          ./scripts/build-spacemandmm-helpers.ps1 -UpstreamPath ./integration/SpacemanDMM -OutputDirectory ./integration -ManifestPath ./integration/helpers-manifest.json
          $env:MERIDIAN_MCP_HELPER_MANIFEST = "$env:GITHUB_WORKSPACE/integration/helpers-manifest.json"
          cargo build --locked --release
      - name: Run real Meridian-Rift analysis compatibility
        shell: pwsh
        run: ./scripts/run-meridian-analysis-compatibility.ps1 -MeridianRiftRoot ./integration/Meridian-Rift -BinaryPath ./target/release/meridian-mcp -HelperManifestPath ./integration/helpers-manifest.json -EvidencePath ./integration/evidence/ubuntu-analysis.json
      - name: Upload Ubuntu analysis evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-meridian-analysis-evidence
          path: integration/evidence/*.json
          if-no-files-found: warn
