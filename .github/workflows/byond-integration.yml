name: BYOND integration

env:
  MERIDIAN_BUILD_REVISION: ${{ github.sha }}
  MERIDIAN_BUILD_DIRTY: "false"

on:
  workflow_dispatch:
    inputs:
      meridian_ref:
        description: Meridian-Rift branch, tag, or SHA
        required: false
        default: aphelion-agents
        type: string
  schedule:
    - cron: "17 4 * * 1"

jobs:
  windows-meridian-compatibility:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Check out exact SpacemanDMM helper source
        uses: actions/checkout@v7
        with:
          repository: SpaceManiac/SpacemanDMM
          ref: 351ddc0ffb2439876d4565ce5130bb6b027ee605
          path: integration/SpacemanDMM
      - name: Check out Meridian-Rift
        uses: actions/checkout@v7
        with:
          repository: AphelionDevelopment/Meridian-Rift
          ref: ${{ inputs.meridian_ref || 'aphelion-agents' }}
          path: integration/Meridian-Rift
      - name: Verify Meridian-Rift full-build qualification inputs
        shell: pwsh
        run: |
          foreach ($requiredPath in @('tgstation.dme', 'BUILD.cmd', 'RIFT_BUILD.cmd', 'dependencies.sh')) {
            $resolvedPath = Join-Path './integration/Meridian-Rift' $requiredPath
            if (-not (Test-Path -LiteralPath $resolvedPath -PathType Leaf)) {
              throw "The selected Meridian-Rift ref is not qualified for full-build compatibility: missing $requiredPath."
            }
          }
      - uses: actions/checkout@v7
        with:
          repository: wolfpld/tracy
          ref: 099df3de3dc37eca4712c06b8320fb9c53596edd
          path: integration/tracy
      - uses: actions/checkout@v7
        with:
          repository: spacestation13/byond-tracy
          ref: d1ec404737b04b1ea73d6df4a1b477deacdb1900
          path: integration/byond-tracy
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Test Meridian compatibility evidence validation
        shell: pwsh
        run: ./scripts/test-meridian-evidence-validation.ps1
      - name: Freshly build exact SpacemanDMM dmdoc helper
        shell: pwsh
        run: |
          cargo clean --manifest-path ./integration/SpacemanDMM/Cargo.toml
          ./scripts/build-spacemandmm-helpers.ps1 -UpstreamPath ./integration/SpacemanDMM -OutputDirectory ./integration -ManifestPath ./integration/helpers-manifest.json
      - name: Build exact Tracy helper and hook
        shell: pwsh
        run: |
          $env:PATH = 'C:\Program Files\Git\usr\bin;' + $env:PATH
          ./scripts/build-tracy-helpers.ps1 -TracyPath ./integration/tracy -ByondTracyPath ./integration/byond-tracy -OutputDirectory ./integration -ManifestPath ./integration/helpers-manifest.json
      - name: Verify Meridian-Rift BYOND pin
        shell: pwsh
        run: |
          $dependencies = Get-Content ./integration/Meridian-Rift/dependencies.sh
          $major = ($dependencies | Select-String '^export BYOND_MAJOR=([0-9]+)$').Matches.Groups[1].Value
          $minor = ($dependencies | Select-String '^export BYOND_MINOR=([0-9]+)$').Matches.Groups[1].Value
          if ("$major.$minor" -ne '516.1687') {
            throw "Meridian-Rift pins BYOND $major.$minor; review the named compatibility baseline before updating this workflow."
          }
      - name: Install BYOND 516.1687
        shell: pwsh
        run: |
          ./scripts/install-byond.ps1 `
            -Version 516.1687 `
            -ArchivePath "$env:RUNNER_TEMP\byond.zip" `
            -DestinationPath "$env:RUNNER_TEMP\byond" `
            -ExpectedSha256 6A69818D8216E089D5C16506659A8883D8CCF06A673A2DD9F7C0777E81BCD9A4
      - name: Install pinned BYOND x86 runtime prerequisites
        shell: pwsh
        env:
          MERIDIAN_DXSDK_PACKAGE: Microsoft.DXSDK.D3DX
          MERIDIAN_DXSDK_VERSION: 9.29.952.8
          MERIDIAN_DXSDK_SHA256: ead0906ae8a26c18a7525da7490127a2110f7c58f18293738283e30e97c6ea4b
        run: |
          ./scripts/install-byond-runtime.ps1 `
            -ApplicationDirectory "$env:RUNNER_TEMP\byond\byond\bin" `
            -DownloadDirectory ./integration/evidence/byond-runtime-package `
            -EvidencePath ./integration/evidence/byond-runtime.json
      - name: Install auxtools x86 runtime
        shell: pwsh
        run: ./scripts/install-auxtools-runtime.ps1
      - name: Freshly build release Meridian-MCP and SpacemanDMM crates
        shell: pwsh
        run: |
          $env:MERIDIAN_MCP_HELPER_MANIFEST = "$env:GITHUB_WORKSPACE/integration/helpers-manifest.json"
          cargo clean
          cargo build --locked --release
          ./scripts/fetch-auxtools.ps1 -DestinationRoot ./target/release
      - name: Run owned fixture and Meridian-Rift compatibility gates
        id: meridian_gate
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/run-byond-integration.ps1 `
            -MeridianRiftRoot ./integration/Meridian-Rift `
            -DreamMakerPath "$env:RUNNER_TEMP\byond\byond\bin\dm.exe" `
            -BinaryPath ./target/release/meridian-mcp.exe `
            -EvidencePath ./integration/evidence/meridian-compatibility.json
      - name: Run managed provenance and integrity gate
        id: provenance_gate
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/run-provenance-integrity-integration.ps1 `
            -DreamMakerPath "$env:RUNNER_TEMP\byond\byond\bin\dm.exe" `
            -BinaryPath ./target/release/meridian-mcp.exe `
            -EvidencePath ./integration/evidence/provenance-integrity.json
      - name: Run live auxtools debugger gate
        id: auxtools_gate
        continue-on-error: true
        shell: pwsh
        run: ./scripts/run-auxtools-integration.ps1 -DreamMakerPath "$env:RUNNER_TEMP\byond\byond\bin\dm.exe" -BinaryPath ./target/release/meridian-mcp.exe -EvidencePath ./integration/evidence/auxtools-compatibility.json -HostMode headless
      - name: Run live Tracy profiler gate
        id: tracy_gate
        continue-on-error: true
        shell: pwsh
        run: ./scripts/run-tracy-integration.ps1 -DreamMakerPath "$env:RUNNER_TEMP\byond\byond\bin\dm.exe" -BinaryPath ./target/release/meridian-mcp.exe -HelperManifestPath ./integration/helpers-manifest.json -EvidencePath ./integration/evidence/tracy-compatibility.json
      - name: Enforce independent Windows live gates
        if: always()
        shell: pwsh
        env:
          MERIDIAN_OUTCOME: ${{ steps.meridian_gate.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance_gate.outcome }}
          AUXTOOLS_OUTCOME: ${{ steps.auxtools_gate.outcome }}
          TRACY_OUTCOME: ${{ steps.tracy_gate.outcome }}
        run: |
          $failures = @()
          if ($env:MERIDIAN_OUTCOME -eq 'failure') { $failures += 'owned fixture and Meridian-Rift' }
          if ($env:PROVENANCE_OUTCOME -eq 'failure') { $failures += 'managed provenance and integrity' }
          if ($env:AUXTOOLS_OUTCOME -eq 'failure') { $failures += 'auxtools debugger' }
          if ($env:TRACY_OUTCOME -eq 'failure') { $failures += 'Tracy profiler' }
          if ($failures.Count -gt 0) {
            throw "Windows live compatibility gate failures: $([string]::Join(', ', $failures))."
          }
      - name: Upload Windows Meridian compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-meridian-compatibility-evidence
          path: |
            integration/evidence/**
            !**/*.tracy
            !**/*.dm
            !**/*.dme
            !**/*.dmb
            !**/*.rsc
          if-no-files-found: warn

  prototype-parser-compatibility:
    name: Prototype parser (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows
            artifact: windows
            binary: ./target/release/meridian-mcp.exe
          - os: ubuntu-24.04
            label: Ubuntu 24.04
            artifact: ubuntu
            binary: ./target/release/meridian-mcp
    steps:
      - uses: actions/checkout@v7
      - name: Check out exact SpacemanDMM source
        uses: actions/checkout@v7
        with:
          repository: SpaceManiac/SpacemanDMM
          ref: 351ddc0ffb2439876d4565ce5130bb6b027ee605
          path: integration/SpacemanDMM
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Freshly build exact parser and dmdoc helper
        shell: pwsh
        run: |
          cargo clean --manifest-path ./integration/SpacemanDMM/Cargo.toml
          ./scripts/build-spacemandmm-helpers.ps1 -UpstreamPath ./integration/SpacemanDMM -OutputDirectory ./integration -ManifestPath ./integration/helpers-manifest.json
          cargo build --locked --release
      - name: Run over-64K MCP parser gate
        shell: pwsh
        run: ./scripts/run-large-prototype-parser-integration.ps1 -BinaryPath "${{ matrix.binary }}" -HelperManifestPath ./integration/helpers-manifest.json -EvidencePath "./integration/evidence/prototype-parser-${{ matrix.artifact }}.json"
      - name: Upload parser compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prototype-parser-${{ matrix.artifact }}-evidence
          path: integration/evidence/*.json
          if-no-files-found: warn

  prototype-runtime-compatibility:
    name: Prototype runtime (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Ubuntu 24.04 required
            artifact: ubuntu
            required: true
          - os: windows-2025
            label: Windows diagnostic
            artifact: windows
            required: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux x86 runtime
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends lib32z1 libcurl4t64:i386
      - name: Install verified Linux BYOND 516.1687
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/install-byond-linux.ps1 -Version 516.1687 -ArchivePath "$env:RUNNER_TEMP/byond-linux.zip" -DestinationPath "$env:RUNNER_TEMP/byond-linux" -ExpectedSha256 8F43564407BB3117827F6727A6192ECAFFA3538AF76742B2FCD083F1CCCF4D8A
      - name: Install verified Windows BYOND 516.1687
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-byond.ps1 -Version 516.1687 -ArchivePath "$env:RUNNER_TEMP\byond.zip" -DestinationPath "$env:RUNNER_TEMP\byond" -ExpectedSha256 6A69818D8216E089D5C16506659A8883D8CCF06A673A2DD9F7C0777E81BCD9A4
      - name: Install Windows BYOND runtime prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MERIDIAN_DXSDK_PACKAGE: Microsoft.DXSDK.D3DX
          MERIDIAN_DXSDK_VERSION: 9.29.952.8
          MERIDIAN_DXSDK_SHA256: ead0906ae8a26c18a7525da7490127a2110f7c58f18293738283e30e97c6ea4b
        run: ./scripts/install-byond-runtime.ps1 -ApplicationDirectory "$env:RUNNER_TEMP\byond\byond\bin" -DownloadDirectory "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/prerequisites/package" -EvidencePath "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/prerequisites/byond-runtime.json"
      - name: Run 50K control fixture
        id: control_runtime
        continue-on-error: ${{ !matrix.required }}
        shell: pwsh
        run: |
          $byondBin = if ($IsWindows) { "$env:RUNNER_TEMP\byond\byond\bin" } else { "$env:RUNNER_TEMP/byond-linux/byond/bin" }
          if ($IsLinux) {
            $env:PATH = $byondBin + [IO.Path]::PathSeparator + $env:PATH
            $env:LD_LIBRARY_PATH = $byondBin
          }
          $dreamMaker = Join-Path $byondBin $(if ($IsWindows) { 'dm.exe' } else { 'DreamMaker' })
          $prerequisiteEvidence = if ($IsWindows) { "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/prerequisites/byond-runtime.json" } else { '' }
          ./scripts/run-large-prototype-integration.ps1 -DreamMakerPath $dreamMaker -PrototypeCount 50000 -RuntimeCase control -ExpectedByondVersion 516.1687 -PrerequisiteEvidencePath $prerequisiteEvidence -RuntimeTimeoutSeconds 300 -EvidencePath "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/control/evidence.json"
      - name: Run over-64K boundary fixture
        if: ${{ matrix.required || steps.control_runtime.outcome == 'success' }}
        shell: pwsh
        run: |
          $byondBin = if ($IsWindows) { "$env:RUNNER_TEMP\byond\byond\bin" } else { "$env:RUNNER_TEMP/byond-linux/byond/bin" }
          if ($IsLinux) {
            $env:PATH = $byondBin + [IO.Path]::PathSeparator + $env:PATH
            $env:LD_LIBRARY_PATH = $byondBin
          }
          $dreamMaker = Join-Path $byondBin $(if ($IsWindows) { 'dm.exe' } else { 'DreamMaker' })
          $prerequisiteEvidence = if ($IsWindows) { "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/prerequisites/byond-runtime.json" } else { '' }
          ./scripts/run-large-prototype-integration.ps1 -DreamMakerPath $dreamMaker -PrototypeCount 65537 -RuntimeCase boundary -ExpectedByondVersion 516.1687 -ControlEvidencePath "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/control/evidence.json" -PrerequisiteEvidencePath $prerequisiteEvidence -RuntimeTimeoutSeconds 300 -EvidencePath "./integration/evidence/prototype-runtime/${{ matrix.artifact }}/boundary/evidence.json"
      - name: Report Windows runtime diagnostic
        if: ${{ runner.os == 'Windows' && steps.control_runtime.outcome == 'failure' }}
        shell: pwsh
        run: Write-Output '::warning::Windows prototype runtime diagnostic did not reach readiness; retained evidence is uploaded below. Ubuntu remains the required runtime compatibility authority.'
      - name: Upload runtime compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prototype-runtime-${{ matrix.artifact }}-evidence
          path: integration/evidence/prototype-runtime/${{ matrix.artifact }}/**
          if-no-files-found: warn

  tracy-linux-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: wolfpld/tracy
          ref: 099df3de3dc37eca4712c06b8320fb9c53596edd
          path: integration/tracy
      - uses: actions/checkout@v7
        with:
          repository: spacestation13/byond-tracy
          ref: d1ec404737b04b1ea73d6df4a1b477deacdb1900
          path: integration/byond-tracy
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install x86 runtime and build support
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends gcc-multilib g++-multilib patch lib32z1 libcurl4t64:i386
      - name: Install verified Linux BYOND 516.1687
        shell: pwsh
        run: ./scripts/install-byond-linux.ps1 -Version 516.1687 -ArchivePath "$env:RUNNER_TEMP/byond-linux.zip" -DestinationPath "$env:RUNNER_TEMP/byond-linux" -ExpectedSha256 8F43564407BB3117827F6727A6192ECAFFA3538AF76742B2FCD083F1CCCF4D8A
      - name: Build Tracy package and release MCP
        shell: pwsh
        run: |
          ./scripts/build-tracy-helpers.ps1 -TracyPath ./integration/tracy -ByondTracyPath ./integration/byond-tracy -OutputDirectory ./integration -ManifestPath ./integration/helpers-manifest.json
          cargo build --locked --release
      - name: Run live Linux Tracy profiler gate
        shell: pwsh
        run: |
          $byondBin = "$env:RUNNER_TEMP/byond-linux/byond/bin"
          $env:PATH = $byondBin + [IO.Path]::PathSeparator + $env:PATH
          $env:LD_LIBRARY_PATH = $byondBin
          ./scripts/run-tracy-integration.ps1 -DreamMakerPath "$byondBin/DreamMaker" -BinaryPath ./target/release/meridian-mcp -HelperManifestPath ./integration/helpers-manifest.json -EvidencePath ./integration/evidence/tracy-linux-compatibility.json
      - name: Upload Linux Tracy compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tracy-linux-compatibility-evidence
          path: |
            integration/evidence/*.json
            !**/*.tracy
          if-no-files-found: warn
